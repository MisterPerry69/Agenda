<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>QuestLog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#232020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- COVER PLACEHOLDER: la grafica definitiva la realizza l'utente.
       Durante la cover si fa il precaricamento dati (fruizione poi immediata). -->
  <div id="cover" class="cover" onclick="openAgenda()">
    <div class="cover-placeholder">QuestLog<br><small>(cover placeholder — tap per aprire)</small></div>
  </div>

  <div id="app" class="app hidden">
    <div class="page" id="page">
      <header class="ag-head">
        <div id="ag-title" class="ag-title">—</div>
        <button id="nav-prev" class="nav-btn">‹</button>
        <button id="nav-next" class="nav-btn">›</button>
      </header>

      <main id="ag-body" class="ag-body"></main>

      <!-- post-it: quadrato in basso a sinistra -->
      <button id="note-btn" class="note-btn" onclick="openPostit()">✎</button>

      <!-- barra viste in basso -->
      <nav class="view-switch">
        <button data-view="day"   class="vbtn active">Giorno</button>
        <button data-view="week"  class="vbtn">Settimana</button>
        <button data-view="month" class="vbtn">Mese</button>
      </nav>
    </div>
  </div>

  <!-- EDITOR VOCE -->
  <div id="editor" class="editor hidden">
    <div class="editor-card">
      <input id="ed-title" class="ed-input" placeholder="Cosa?">
      <input id="ed-time" class="ed-input" type="time">
      <div id="ed-cats" class="ed-cats"></div>
      <label class="ed-google"><input id="ed-google" type="checkbox"> Metti su Google Calendar</label>
      <div class="ed-actions">
        <button id="ed-delete" class="hidden" onclick="deleteCurrent()">Elimina</button>
        <button onclick="closeEditor()">Annulla</button>
        <button id="ed-save" onclick="saveEntry()">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODAL POST-IT (nota globale) -->
  <div id="postit-modal" class="postit-modal hidden">
    <div class="postit" id="postit">
      <div class="postit-top">
        <div class="postit-colors" id="postit-colors"></div>
        <button class="postit-close" onclick="closePostit()">✕</button>
      </div>
      <textarea id="postit-text" placeholder="Scrivi quel che vuoi…"></textarea>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>QuestLog</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#232020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- COVER PLACEHOLDER: la grafica definitiva la realizza l'utente.
       Durante la cover si fa il precaricamento dati (fruizione poi immediata). -->
  <div id="cover" class="cover" onclick="openAgenda()">
    <div class="cover-hint">tap per aprire</div>
  </div>

  <div id="app" class="app hidden">
    <!-- bookmark e post-it stanno FUORI da .page così possono sbordare dai bordi -->
    <button id="bookmark" class="bookmark" onclick="openTracking()" title="Voti del giorno"></button>
    <button id="note-btn" class="note-btn" onclick="openPostit()"></button>
    <!-- linguette delle liste usa-e-getta, impilate sopra al post-it main, cliccabili -->
    <div id="temp-tabs" class="temp-tabs"></div>

    <div class="page" id="page">
      <header class="ag-head">
        <div id="ag-title" class="ag-title">—</div>
      </header>

      <main id="ag-body" class="ag-body"></main>

      <!-- barra viste in basso -->
      <nav class="view-switch">
        <button data-view="day"   class="vbtn active">Giorno</button>
        <button data-view="week"  class="vbtn">Settimana</button>
        <button data-view="month" class="vbtn">Mese</button>
      </nav>
    </div>
  </div>

  <!-- EDITOR VOCE -->
  <div id="editor" class="editor hidden">
    <div class="editor-card">
      <input id="ed-title" class="ed-input" placeholder="Cosa?" autocomplete="off" name="ql-title">

      <!-- riga NORMALE: orario + data singola -->
      <div id="ed-row-normal" class="ed-row">
        <input id="ed-time" class="ed-input ed-half" type="time" autocomplete="off" name="ql-time">
        <input id="ed-date" class="ed-input ed-half ed-date-locked" type="date" disabled autocomplete="off" name="ql-date">
      </div>

      <!-- campi FINE: compaiono solo con "Estendi data" (solo modalità normale) -->
      <div id="ed-end-row" class="ed-row hidden">
        <input id="ed-time-end" class="ed-input ed-half" type="time" autocomplete="off" name="ql-time-end">
        <input id="ed-date-end" class="ed-input ed-half" type="date" autocomplete="off" name="ql-date-end">
      </div>

      <!-- riga RICORRENTE: tipo ripetizione + intervallo + data inizio -->
      <div id="ed-row-recurring" class="ed-row hidden">
        <select id="ed-rec-freq" class="ed-input ed-half">
          <option value="year">Ogni anno</option>
          <option value="month">Ogni mese</option>
          <option value="week">Ogni settimana</option>
        </select>
        <input id="ed-rec-interval" class="ed-input ed-quarter" type="number" min="1" value="1" title="ogni N">
        <input id="ed-rec-start" class="ed-input ed-half" type="date" autocomplete="off" name="ql-rec-start">
      </div>
      <label id="ed-allday-row" class="ed-flag hidden"><input id="ed-allday" type="checkbox" onchange="onAllDayToggle()"> Tutto il giorno</label>

      <div class="ed-flags">
        <label id="ed-todo-row" class="ed-flag"><input id="ed-todo" type="checkbox" onchange="onTodoToggle()"> Todo</label>
        <label class="ed-flag"><input id="ed-google" type="checkbox" onchange="onGoogleToggle()"> Google Calendar</label>
        <label id="ed-extend-row" class="ed-flag"><input id="ed-extend" type="checkbox" onchange="onExtendToggle()"> Estendi data</label>
        <button id="ed-move" type="button" class="ed-move" onclick="onMoveToggle()" title="Sposta ad un altro giorno">⏩</button>
      </div>

      <div id="ed-cats" class="ed-cats"></div>

      <button id="ed-topostit" class="ed-topostit hidden" onclick="entryToPostit()">↩ Sposta nel post-it</button>
      <div class="ed-actions">
        <button id="ed-delete" class="hidden" onclick="deleteCurrent()">Elimina</button>
        <button id="ed-recurring" type="button" class="ed-recurring" onclick="onRecurringToggle()" title="Rendi ricorrente">🔁</button>
        <button onclick="closeEditor()">Annulla</button>
        <button id="ed-save" onclick="saveEntry()">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODAL SCELTA NOTIFICHE (quando si spunta "Google Calendar") -->
  <div id="rem-modal" class="rem-modal hidden">
    <div class="rem-card">
      <div class="rem-title">Notifiche</div>
      <label class="rem-opt"><input type="checkbox" value="0"> All'ora esatta</label>
      <label class="rem-opt"><input type="checkbox" value="10"> 10 minuti prima</label>
      <label class="rem-opt"><input type="checkbox" value="60"> 1 ora prima</label>
      <label class="rem-opt"><input type="checkbox" value="1440"> 1 giorno prima</label>
      <div class="rem-actions">
        <button onclick="remCancel()">Annulla</button>
        <button onclick="remConfirm()">Conferma</button>
      </div>
    </div>
  </div>

  <!-- MODAL SCELTA SCOPE (modifica/eliminazione di un'occorrenza in serie) -->
  <div id="scope-modal" class="rem-modal hidden">
    <div class="rem-card">
      <div class="rem-title" id="scope-title">Applica a</div>
      <div class="rem-actions" style="justify-content:center; flex-direction:column; gap:10px;">
        <button onclick="_scopeResolve('this')">Solo questa occorrenza</button>
        <button onclick="_scopeResolve('following')">Questa e le successive</button>
      </div>
    </div>
  </div>

  <!-- MODAL RINNOVO SERIE (quando l'ultima occorrenza è arrivata) -->
  <div id="renew-modal" class="rem-modal hidden">
    <div class="rem-card">
      <div class="rem-title" id="renew-title">Rinnovare la ricorrenza?</div>
      <div class="rem-actions">
        <button onclick="renewDecline()">No</button>
        <button onclick="renewConfirm()">Sì, genera altre</button>
      </div>
    </div>
  </div>

  <!-- MODAL POST-IT (lista di cose da fare generiche) -->
  <div id="postit-modal" class="postit-modal hidden">
    <div class="postit" id="postit">
      <!-- due forellini in alto: visibili solo sulle liste usa-e-getta (foglio strappato dal blocco) -->
      <span class="punch-hole punch-l"></span>
      <span class="punch-hole punch-r"></span>
      <div class="postit-top">
        <div class="postit-colors" id="postit-colors"></div>
        <button class="postit-close" onclick="closePostit()">✕</button>
      </div>
      <input id="postit-input" class="postit-input" placeholder="Aggiungi… (invio)">
      <div id="postit-list" class="postit-list"></div>
      <!-- fronte di fiamma usato dall'animazione "burn" quando la lista si esaurisce -->
      <span class="burn-edge"></span>
    </div>
  </div>

  <!-- MODAL scelta su un item del post-it -->
  <div id="pi-choice" class="pi-choice hidden">
    <div class="pi-choice-card">
      <input id="pi-choice-text" class="pi-choice-text" placeholder="testo…">
      <button class="pi-btn pi-done" onclick="piMarkDone()">✓ Segna come fatta</button>
      <button class="pi-btn pi-toagenda" onclick="piToAgenda()">📅 Mettila in agenda oggi</button>
      <button class="pi-btn pi-cancel" onclick="piCloseChoice()">Annulla</button>
    </div>
  </div>

  <!-- VISTA TRACKING (report del giorno a fasce) -->
  <div id="tracking" class="tracking hidden">
    <div class="tk-page" id="tk-page">
      <header class="tk-head">
        <div id="tk-title" class="tk-title">—</div>
        <button class="tk-close" onclick="closeTracking()">✕</button>
      </header>
      <div class="tk-rule"></div>
      <div id="tk-slots" class="tk-slots"></div>
      <!-- recap medie del giorno visualizzato -->
      <div id="tk-recap" class="tk-recap"></div>
    </div>
  </div>

  <!-- RIEPILOGO MENSILE (grafico 3 linee + medie) — si apre dal bookmark in vista MESE -->
  <div id="monthstats" class="tracking hidden">
    <div class="tk-page">
      <header class="tk-head">
        <div id="ms-title" class="tk-title">—</div>
        <button class="tk-close" onclick="closeMonthStats()">✕</button>
      </header>
      <div class="tk-rule"></div>
      <div id="ms-body" class="ms-body"></div>
    </div>
  </div>

  <!-- MODAL VOTI (unico, non più a step) -->
  <div id="rate" class="rate hidden">
    <div class="rate-card">
      <div id="rate-slot" class="rate-slot">—</div>

      <div class="rate-field">
        <div class="rate-q">Cosa hai fatto?</div>
        <!-- autocomplete: suggerimenti da storico DB + eventi della fascia -->
        <div class="rate-ac-wrap">
          <input id="rate-act" class="rate-input" placeholder="scrivi…" autocomplete="off">
          <div id="rate-ac" class="rate-ac hidden"></div>
        </div>
      </div>

      <div class="rate-field">
        <div class="rate-q">Piacevolezza <span id="rate-pleasure-val" class="rate-num">5</span></div>
        <input id="rate-pleasure" class="rate-slider" type="range" min="1" max="10" value="5">
      </div>

      <div class="rate-field">
        <div class="rate-q">Utilità <span id="rate-utility-val" class="rate-num">5</span></div>
        <input id="rate-utility" class="rate-slider" type="range" min="1" max="10" value="5">
      </div>

      <div class="rate-field">
        <div class="rate-q">Mood <span id="rate-mood-val" class="rate-num">5</span><span id="rate-mood-face" class="rate-face">😐</span></div>
        <input id="rate-mood" class="rate-slider mood" type="range" min="1" max="10" value="5">
      </div>

      <div class="rate-actions">
        <button class="rate-cancel" onclick="closeRate()">Annulla</button>
        <button class="rate-save" onclick="rateSave()">Salva</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
